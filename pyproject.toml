[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "know_your_ip"
description = "Batch IP address enrichment for research: rate-limit aware, cached, reproducible, and useful without API keys"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Suriyan Laohaprapanon", email = "suriyant@gmail.com"},
    {name = "Gaurav Sood", email = "gsood07@gmail.com"}
]
keywords = ["ip", "geoip", "geolocation", "abuseipdb", "virustotal", "shodan", "censys", "threat-intelligence", "ip-reputation", "network-measurement"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
    "Topic :: Utilities"
]
requires-python = ">=3.11"
dependencies = [
    "maxminddb>=3.0",
    "requests>=2.31",
    "pydantic>=2.0"
]
version = "0.6.2"

[project.optional-dependencies]
# Real optional features. timezonefinder ships wheels only for linux-x86_64 and
# is ~55MB; every other platform builds it from source. MaxMind's City database
# already reports location.time_zone, so this is an opt-in cross-check.
timezone = ["timezonefinder>=6.0"]
shodan = ["shodan>=1.31"]
pandas = ["pandas>=2.0"]

[dependency-groups]
dev = [
    {include-group = "test"},
    {include-group = "docs"},
    "ruff",
    "pre-commit",
    "build",
    "twine",
    "pyright>=1.1.390",
    "pydoclint>=0.5",
    "pytest>=8",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "responses>=0.25",
    "hypothesis>=6",
    # The shipped notebook is executed, not just parsed. It broke in 0.4.0 and
    # nothing caught it because nothing ran it.
    "nbclient>=0.10",
    "nbformat>=5",
    "ipykernel>=6",
    # Mirrors the optional pandas extra so pyright can resolve the import in
    # enrich.py and the to_dataframe tests stop being skipped.
    "pandas>=2.0",
]
docs = [
    "sphinx>=7.0",
    "furo",
    "sphinx-copybutton",
    "myst-parser",
    "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
]

[project.urls]
Homepage = "https://github.com/themains/know-your-ip"
Repository = "https://github.com/themains/know-your-ip"
Documentation = "https://themains.github.io/know-your-ip/"
"Bug Tracker" = "https://github.com/themains/know-your-ip/issues"

[project.scripts]
know_your_ip = "know_your_ip.core:main"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention the fleet standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`, which
# the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300", "B008", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ARG", "SLF"]
"docs/**" = ["D"]
"examples/**" = ["T20", "D"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
filterwarnings = [
    "error",
    # timezonefinder leaks a file handle in a __del__; not ours to fix, and
    # everything else stays an error.
    "ignore:unclosed file.*coordinates.fbs:ResourceWarning",
    "ignore::ResourceWarning:timezonefinder.*",
]
markers = [
    "real_sleep: test asserts on real timing; do not stub sleep or rate limits",
    "network: makes real network calls; deselect with -m 'not network'",
]

[tool.deptry]
# Exclude directories from scanning
extend_exclude = [
    ".tox",
    ".mypy_cache",
    "build",
    "dist",
    "docs"
]

# Development dependency groups to ignore for unused dependency checks
pep621_dev_dependency_groups = []

# pandas is an opt-in extra for users who want DataFrame output; the package
# itself never imports it.
per_rule_ignores = { "DEP002" = ["pandas"] }

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[tool.codespell]
# The presentation PDF is a binary artifact; scanning it yields only noise.
# Generated artifacts (Sphinx output, lockfiles, the presentation PDF)
# yield only noise.
skip = "*.pdf,*.lock,*/_build/*,*/.git/*,*/dist/*,*/.venv/*,*/htmlcov/*"

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.preen]
# Two API bases here are alive but only answer with a path, so fetching them
# bare reports a dead link for an endpoint this package uses successfully:
#
#   rdap.arin.net/registry/            -> 404
#   rdap.arin.net/registry/ip/8.8.8.8  -> 200   (what the code actually calls)
#   api.platform.censys.io             -> 404   (called as /v3/global/asset/...)
#
# Written without schemes on purpose: a full URL in this comment is itself
# extracted and checked, so documenting the problem here would recreate it.
#
# Narrower than skip_checks = ["links"], which would also stop checking README.
link_ignore = [
    "rdap\\.arin\\.net",
    "api\\.platform\\.censys\\.io",
]

[tool.uv.build-backend]
module-name = "know_your_ip"
