[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "know_your_ip"
version = "0.3.0"
description = "Get data on IP addresses"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Suriyan Laohaprapanon", email = "suriyant@gmail.com"},
    {name = "Gaurav Sood", email = "gsood07@gmail.com"}
]
keywords = ["ip", "geoip", "geolocation", "abuseipdb", "virustotal", "shodan", "censys", "threat-intelligence", "ip-reputation", "network-measurement"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
    "Topic :: Utilities"
]
requires-python = ">=3.11"
dependencies = [
    "maxminddb>=3.0",
    "requests>=2.31",
    "pydantic>=2.0"
]

[project.optional-dependencies]
# Real optional features. timezonefinder ships wheels only for linux-x86_64 and
# is ~55MB; every other platform builds it from source. MaxMind's City database
# already reports location.time_zone, so this is an opt-in cross-check.
timezone = ["timezonefinder>=6.0"]
shodan = ["shodan>=1.31"]
pandas = ["pandas>=2.0"]

[dependency-groups]
dev = [
    {include-group = "test"},
    {include-group = "docs"},
    "ruff",
    "pre-commit",
    "build",
    "twine",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "responses>=0.25",
]
docs = [
    "sphinx>=7.0",
    "furo",
    "sphinx-copybutton",
    "myst-parser",
]

[project.urls]
Homepage = "https://github.com/themains/know-your-ip"
Repository = "https://github.com/themains/know-your-ip"
Documentation = "https://themains.github.io/know-your-ip/"
"Bug Tracker" = "https://github.com/themains/know-your-ip/issues"

[project.scripts]
know_your_ip = "know_your_ip.core:main"

[tool.setuptools]
packages = ["know_your_ip"]

# PEP 561 marker so type checkers trust the package's inline annotations.
[tool.setuptools.package-data]
know_your_ip = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.deptry]
# Exclude directories from scanning
extend_exclude = [
    ".tox",
    ".mypy_cache",
    "build",
    "dist",
    "docs"
]

# Development dependency groups to ignore for unused dependency checks
pep621_dev_dependency_groups = []

# pandas is an opt-in extra for users who want DataFrame output; the package
# itself never imports it.
per_rule_ignores = { "DEP002" = ["pandas"] }

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
exclude = "\\.venv|docs|dist"

[tool.codespell]
# The presentation PDF is a binary artifact; scanning it yields only noise.
skip = "*.pdf,*.lock,./docs/build,./.git,./dist"

[tool.pyright]
# shodan and timezonefinder are optional extras imported lazily inside the
# functions that need them; they are intentionally absent from a base install.
reportMissingImports = "warning"
