name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v8.3.2
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --group dev

    - name: Lint with ruff
      run: |
        uv run ruff check .
        uv run ruff format --check .

    - name: Check dependencies with deptry
      run: uvx deptry .

    - name: Test with pytest
      run: uv run pytest --cov=know_your_ip --cov-report=term --cov-fail-under=80

    - name: Verify the wheel installs and imports
      run: |
        uv build
        uv run --isolated --no-project --with dist/*.whl python -c "import know_your_ip; print(know_your_ip.__version__)"
