name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly: surface ecosystem drift on quiet repos

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: gojiplus/py-canon/.github/workflows/reusable-ci.yml@v1
    with:
      wheel-import: know_your_ip
      coverage-floor: 80
      # This package shells out to ping and traceroute and writes CSV, all of
      # which differ per platform: the macOS -W flag is milliseconds while
      # Linux's is seconds, and CSV needs newline="" on Windows. Both bugs
      # shipped unnoticed under a Linux-only matrix.
      # windows-latest is omitted for now: py-canon's reusable-ci runs its
      # "Sync environment" step with bash syntax and no `shell: bash`, so
      # PowerShell fails to parse it before any test runs. Re-add once that
      # step declares a shell.
      os: '["ubuntu-latest", "macos-latest"]'
      python-versions: '["3.11", "3.14"]'
