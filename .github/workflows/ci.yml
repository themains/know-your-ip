name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly: surface ecosystem drift on quiet repos

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: gojiplus/py-canon/.github/workflows/reusable-ci.yml@v1
    with:
      wheel-import: know_your_ip
      coverage-floor: 90
      # ping, traceroute, and CSV behavior differ across these platforms.
      os: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      python-versions: '["3.11", "3.14"]'
